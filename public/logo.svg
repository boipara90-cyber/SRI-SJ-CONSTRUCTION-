<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rozha+One&amp;family=Yatra+One&amp;family=Noto+Sans+Devanagari:wght@700;800;900&amp;display=swap');
      .devanagari-glyph {
        font-family: 'Rozha One', 'Yatra One', 'Noto Sans Devanagari', 'Mangal', 'Mukta', 'Lohit Devanagari', sans-serif;
        font-weight: 900;
      }
    </style>
  </defs>

  <!-- 1. Pure White Background Canvas -->
  <rect width="600" height="600" fill="#FFFFFF"/>

  <!-- 2. Outer Deep Royal Blue Rectangular Border -->
  <rect x="16" y="16" width="568" height="568" rx="4" fill="none" stroke="#163FA7" stroke-width="8"/>

  <!-- 3. Inner Vivid Orange Rectangular Border -->
  <rect x="32" y="32" width="536" height="536" fill="none" stroke="#F15A10" stroke-width="8"/>

  <!-- 4. Clean Blue Outline of Symmetrical Pitched Roof -->
  <path d="M 72 248 L 300 70 L 528 248" 
        fill="none" 
        stroke="#163FA7" 
        stroke-width="30" 
        stroke-linecap="square" 
        stroke-linejoin="miter" 
        stroke-miterlimit="10"/>

  <!-- 5. Central Vivid Orange 'J' Column (Acts as Central Structural Beam) -->
  <!-- Top apex of J angled along the roof pitch, straight vertical column, curving left at the base -->
  <path d="M 300 120 L 356 164 L 356 460 C 356 488 334 506 294 506 L 244 506 L 244 456 L 286 456 C 302 456 312 448 312 434 L 312 254 L 300 254 Z" 
        fill="#F15A10"/>

  <!-- Bottom Left Orange Foundation Base Wedge (Extension of J / Ground Base) -->
  <polygon points="58,506 204,506 250,456 104,456" fill="#F15A10"/>

  <!-- 6. Left Deep Royal Blue 'S' Monogram -->
  <!-- Top Roof-Parallel Bar of S -->
  <polygon points="96,254 260,254 218,300 96,300" fill="#163FA7"/>

  <!-- Outer Left Rounded Spine of S -->
  <path d="M 96 254 C 74 254 60 268 60 292 L 60 376 C 60 398 74 412 96 412 L 142 412 L 142 368 L 104 368 C 98 368 94 362 94 354 L 94 300 L 96 254 Z" 
        fill="#163FA7"/>

  <!-- Dynamic Lower Sweeping Tail of S -->
  <path d="M 204 362 C 238 362 264 398 264 442 C 264 480 232 506 172 506 C 218 496 244 458 244 422 C 244 380 216 362 204 362 Z" 
        fill="#163FA7"/>
  <path d="M 244 366 C 244 434 206 506 156 506 C 196 506 226 456 226 400 C 226 380 220 366 208 366 Z" 
        fill="#163FA7"/>

  <!-- 7. Devanagari Script Text 'श्री' in Vivid Orange in the Lower Loop of S -->
  <g transform="translate(104, 308)">
    <!-- High-Precision Vector Silhouette of 'श्री' -->
    <path d="M 38 12 C 34 2 24 -6 14 -6 C 2 -6 -6 2 -6 14 C -6 26 2 34 14 36 C 22 38 28 34 32 30 L 32 64 C 32 68 28 72 24 72 L 12 72 L 12 82 L 28 82 C 38 82 44 74 44 64 L 44 12 Z M 14 4 C 18 4 22 8 22 14 C 22 20 18 24 14 24 C 10 24 6 20 6 14 C 6 8 10 4 14 4 Z" fill="#F15A10"/>
    <path d="M 18 36 L -2 60 L 4 66 L 26 42 Z" fill="#F15A10"/>
    <path d="M 44 4 L 72 4 L 72 82 L 60 82 L 60 14 L 44 14 Z" fill="#F15A10"/>
    <path d="M 40 -8 C 50 -20 64 -26 80 -26 C 96 -26 108 -14 108 8 L 108 82 L 96 82 L 96 8 C 96 -6 88 -14 78 -14 C 66 -14 54 -6 48 4 Z" fill="#F15A10"/>
    <path d="M 2 4 L 112 4 L 112 14 L 2 14 Z" fill="#F15A10"/>
    
    <!-- Ultra-Crisp Devanagari Text Rendering Fallback -->
    <text x="56" y="68" 
          font-size="110" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#F15A10" 
          class="devanagari-glyph">श्री</text>
  </g>

  <!-- 8. Right Deep Royal Blue 'C' Geometry -->
  <path d="M 412 254 L 512 254 C 532 254 544 266 544 288 L 544 442 C 544 464 532 506 492 506 L 412 506 C 372 506 360 468 360 442 L 360 288 C 360 266 372 254 412 254 Z M 414 300 L 414 460 L 488 460 C 496 460 500 454 500 444 L 500 288 C 500 278 496 272 488 272 L 414 272 Z" 
        fill="#163FA7" 
        fill-rule="evenodd"/>
</svg>
